services:
  ha-wall-panel:
    build:
      context: .
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.7
        FROM alpine/git:2.49.1 AS source
        RUN --mount=type=secret,id=github_pat \
          git clone --depth 1 --branch main "https://x-access-token:$(cat /run/secrets/github_pat)@github.com/ravilushqa/ha-wall-panel.git" /src \
          && rm -rf /src/.git

        FROM nginx:1.27-alpine
        COPY --from=source /src/docker/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=source /src/docker/40-env.sh /docker-entrypoint.d/40-env.sh
        COPY --from=source /src/app/ /usr/share/nginx/html/.
        RUN chmod +x /docker-entrypoint.d/40-env.sh \
          && rm -rf /usr/share/nginx/html/demo-states
        ENV HASS_URL=
        EXPOSE 80
      secrets:
        - source: github_pat
          target: github_pat
    container_name: ha-wall-panel
    restart: unless-stopped
    environment:
      HASS_URL: https://ha.ravil.space
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ha-wall-panel.rule=Host(`ha-dashboard.ravil.space`)"
      - "traefik.http.routers.ha-wall-panel.entrypoints=websecure"
      - "traefik.http.routers.ha-wall-panel.tls.certresolver=cloudflare"
      - "traefik.http.routers.ha-wall-panel.middlewares=oidc-auth@docker"
      - "traefik.http.services.ha-wall-panel.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"

networks:
  default:
    name: ha-wall-panel_default
  traefik:
    name: traefik_default
    external: true

secrets:
  github_pat:
    environment: GITHUB_PAT
