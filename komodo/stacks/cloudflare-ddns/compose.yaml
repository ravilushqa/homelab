# Keeps *.ravil.space pointed at the dynamic public IPv4 (Telekom PPPoE).
services:
  cloudflare-ddns:
    image: timothyjmiller/cloudflare-ddns:2.3.1
    container_name: cloudflare-ddns
    restart: unless-stopped
    # Infrastructure DDNS intentionally bypasses filtering DNS to repair external access during a Pi-hole outage.
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - IP4_DOMAINS=*.ravil.space
      - IP6_PROVIDER=none
      - TTL=300
