services:
  # VLESS client. qBittorrent's only way to the internet is this SOCKS5 proxy (see the vpn network)
  xray:
    image: teddysun/xray:26.10.21
    restart: unless-stopped
    configs:
      - source: xray
        target: /etc/xray/config.json
    networks:
      - vpn
      - traefik
    labels:
      # qBittorrent is not on the traefik network (that would give it a direct route out), so its
      # web UI is reached through xray's dokodemo-door inbound on :8080
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.ravil.space`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=cloudflare"
      - "traefik.http.routers.qbittorrent.middlewares=oidc-auth@docker"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_default"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    restart: unless-stopped
    depends_on:
      - xray
    # Refuses to start qBittorrent if the container has a route out (see vpn-guard.sh)
    entrypoint: ["/bin/sh", "/vpn-guard.sh"]
    configs:
      - source: vpn-guard
        target: /vpn-guard.sh
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      WEBUI_PORT: 8080
    volumes:
      - qbittorrent:/config
      - type: bind
        # Fileserver's raid1 subvol (bind on the LXC): on the SMB share and not backed up
        source: /mnt/torrents
        target: /data
        bind:
          create_host_path: false
    networks:
      - vpn

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      # Login is done by the oidc-auth middleware; without this Prowlarr forces its own login setup
      PROWLARR__AUTH__METHOD: External
    volumes:
      - prowlarr:/config
    configs:
      # Custom Cardigann indexer (Prowlarr has none for this site); see README, Love-Games
      - source: love-games
        target: /config/Definitions/Custom/love-games.yml
    networks:
      - vpn
      - traefik
      - indexer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.ravil.space`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.prowlarr.middlewares=oidc-auth@docker"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=traefik_default"

  # Cloudflare challenge solver for Prowlarr indexer proxies; only Prowlarr can reach it (indexer network)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      LOG_LEVEL: info
      LOG_HTML: "false"
    networks:
      - indexer
    labels:
      - "traefik.enable=false"

  audiobookrequest:
    image: markbeep/audiobookrequest:1.10.8
    restart: unless-stopped
    environment:
      # Native OIDC (Pocket ID client `audiobookrequest`, group `family`) instead of oidc-auth, so
      # family members can log in. The root user is only the backup login (/login?backup=1)
      ABR_APP__FORCE_LOGIN_TYPE: oidc
      ABR_APP__INIT_ROOT_USERNAME: ${ABR_ROOT_USERNAME}
      ABR_APP__INIT_ROOT_PASSWORD: ${ABR_ROOT_PASSWORD}
    volumes:
      - audiobookrequest:/config
    networks:
      - vpn
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookrequest.rule=Host(`abr.ravil.space`)"
      - "traefik.http.routers.audiobookrequest.entrypoints=websecure"
      - "traefik.http.routers.audiobookrequest.tls.certresolver=cloudflare"
      - "traefik.http.services.audiobookrequest.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik_default"

  # Games *arr: IGDB search, grabs through Prowlarr into qBittorrent (category `games`). Import is
  # off (post-processing disabled by default): the PC takes games from the SMB share
  questarr:
    image: ghcr.io/doezer/questarr:v1.5.0
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # The image's own questarr user (node:alpine's `node` already has 1000). With 1000 the
      # entrypoint remaps the user but never chowns /app/data (BusyBox find has no -uid), so it
      # can't write to the named volume. Questarr doesn't touch the SMB share, so the UID doesn't matter
      PUID: 1001
      PGID: 1001
      APP_URL: https://games.ravil.space
      # Traefik is the only hop; makes the session cookie `Secure`
      TRUST_PROXY: "1"
      IGDB_CLIENT_ID: ${QUESTARR_IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${QUESTARR_IGDB_CLIENT_SECRET}
      # Encrypts the stored Prowlarr API key and qBittorrent password; kept out of the DB volume
      CREDENTIALS_ENCRYPTION_KEY: ${QUESTARR_CREDENTIALS_KEY}
    volumes:
      # SQLite: a named volume, not the SMB/CIFS share
      - questarr:/app/data
    networks:
      # vpn: qbittorrent:8080 API; traefik: route + internet egress for IGDB
      - vpn
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questarr.rule=Host(`games.ravil.space`)"
      - "traefik.http.routers.questarr.entrypoints=websecure"
      - "traefik.http.routers.questarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.questarr.middlewares=oidc-auth@docker"
      - "traefik.http.services.questarr.loadbalancer.server.port=5000"
      - "traefik.docker.network=traefik_default"

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      # App state (SQLite) and metadata/covers stay on local volumes — never on SMB. They are the
      # volumes of the former `audiobookshelf` stack (see the volumes section below)
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
      # Existing read-only CIFS bind on the LXC; fail instead of creating an empty dir if missing
      - type: bind
        source: /mnt/audiobooks
        target: /audiobooks
        read_only: true
        bind:
          create_host_path: false
      # Finished torrents from qBittorrent (fileserver raid1 subvol, keeps seeding from here)
      - type: bind
        source: /mnt/torrents/audiobooks
        target: /downloads
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Healthy only when it is safe to be public. Traefik does not route to a starting or
      # unhealthy container, so this also gates the public route (see audiobookshelf.md):
      #   - /audiobooks is the CIFS share and readable (not the empty dir left when it's unmounted)
      #   - root user exists (a fresh /config would let the first visitor claim root)
      #   - native OIDC is the only active auth method (no password login on the internet)
      # The image is node:24-alpine without curl.
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require("fs");
          const fail = (msg) => { console.error(msg); process.exit(1); };
          const media = fs.readFileSync("/proc/self/mountinfo", "utf8").split("\n").filter((l) => l.split(" ")[4] === "/audiobooks");
          const [type, source] = (media[0] || "").split(" - ")[1]?.split(" ") || [];
          if (media.length !== 1 || type !== "cifs" || source !== "//192.168.1.2/proxmox") fail("/audiobooks is not the CIFS share: " + type + " " + source);
          fs.readdirSync("/audiobooks");
          require("http").get("http://127.0.0.1/status", (res) => {
            let body = "";
            res.on("data", (chunk) => (body += chunk));
            res.on("end", () => {
              const status = JSON.parse(body);
              if (!status.isInit) fail("root user not initialized");
              if (status.authMethods.join() !== "openid") fail("auth methods " + status.authMethods + ", expected only openid");
              process.exit(0);
            });
          }).on("error", (e) => fail(e.message));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - traefik
    labels:
      # No oidc-auth middleware: the mobile apps can't pass it. Auth is Audiobookshelf's native
      # OIDC against Pocket ID, enforced by the healthcheck above
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.ravil.space`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=cloudflare"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"

configs:
  vpn-guard:
    file: ./vpn-guard.sh
  love-games:
    file: ./prowlarr/love-games.yml
  xray:
    content: |
      {
        "log": { "loglevel": "warning" },
        "inbounds": [
          { "tag": "socks", "listen": "0.0.0.0", "port": 1080, "protocol": "socks",
            "settings": { "auth": "noauth", "udp": true } },
          { "tag": "qbit-ui", "listen": "0.0.0.0", "port": 8080, "protocol": "dokodemo-door",
            "settings": { "address": "qbittorrent", "port": 8080, "network": "tcp" } }
        ],
        "outbounds": [
          { "tag": "vless", "protocol": "vless",
            "settings": { "vnext": [ { "address": "${VLESS_HOST}", "port": 443,
              "users": [ { "id": "${VLESS_UUID}", "encryption": "none", "flow": "xtls-rprx-vision" } ] } ] },
            "streamSettings": { "network": "tcp", "security": "reality",
              "realitySettings": { "serverName": "${VLESS_SNI}", "fingerprint": "firefox",
                "publicKey": "${VLESS_PBK}", "shortId": "" } } },
          { "tag": "direct", "protocol": "freedom" }
        ],
        "routing": {
          "rules": [ { "type": "field", "inboundTag": ["qbit-ui"], "outboundTag": "direct" } ]
        }
      }

volumes:
  qbittorrent:
  prowlarr:
  audiobookrequest:
  questarr:
  # Created by the former `audiobookshelf` stack (Compose project `audiobookshelf`). External, so a
  # missing volume fails the deploy instead of starting with an empty DB that anyone could claim
  audiobookshelf-config:
    name: audiobookshelf_config
    external: true
  audiobookshelf-metadata:
    name: audiobookshelf_metadata
    external: true

networks:
  # No gateway: containers only on this network can't reach the internet (kill switch for qBittorrent)
  vpn:
    internal: true
  # Prowlarr ↔ FlareSolverr only. Not internal: FlareSolverr needs internet egress to solve challenges
  indexer:
  traefik:
    name: traefik_default
    external: true
