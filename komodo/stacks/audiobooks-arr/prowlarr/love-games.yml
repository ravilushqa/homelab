  modes:
    search: [q]

settings: []

search:
  # uCoz file catalog search: the site's own form posts query + a=2 to /load/
  paths:
    - path: load/
      method: post
  inputs:
    # Empty query (RSS, Prowlarr's test): this year's releases
    query: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}"
    a: 2

  rows:
    selector: div[id^="entryID"]

  fields:
    # The section id is also in the entry link (/load/igry_dlja_pc/gonki_racing/4-1-0-20488 is section 4).
    # Not div#cat a: the site never closes the title <a>, so the HTML parser clones it into div#cat
    category:
      selector: div.titl a
      attribute: href
      filters:
        - name: regexp
          args: (\d+)-\d+-\d+-\d+$
    title:
      selector: div.titl a
    details:
      selector: div.titl a
      attribute: href
    _id:
      selector: div.titl a
      attribute: href
      filters:
        - name: regexp
          args: (\d+)$
    # The "Скачать торрент" button on the details page
    download:
      text: "{{ .Config.sitelink }}load/0-0-0-{{ .Result._id }}-20"
    size:
      selector: div#status_b
      filters:
        - name: regexp
          args: ([\d.,]+\s*[KMGT]?B)
    grabs:
      selector: div#info
      filters:
        - name: regexp
          args: "Загрузки:\\s*(\\d+)"
    # The site shows no peers; 1 keeps the releases from being dropped as dead
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine uCoz
