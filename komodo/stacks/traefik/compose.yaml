services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    command:
      # API and dashboard
      - --api.dashboard=true
      - --api.debug=true

      # EntryPoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Default middlewares for websecure
      - --entrypoints.websecure.http.middlewares=umami@docker

      # HTTP to HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # Let's Encrypt with Cloudflare DNS challenge
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json

      # Logging
      - --log.level=INFO
      - --accesslog=true
      # Drop query parameters and headers from access logs (privacy).
      # Prevents health-connect sync timing markers from leaking into log shippers
      # (e.g. Alloy → Loki). Supported by Traefik v3.1+; pinned to v3.7.13.
      - --accesslog.fields.queryparameters.defaultmode=drop
      - --accesslog.fields.headers.defaultmode=drop

      # Dynamic file provider (serversTransports for self-signed backends)
      - --providers.file.filename=/etc/traefik/dynamic/servers-transports.yml

      # Global settings
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      # OIDC auth plugin
      - --experimental.plugins.traefik-oidc-auth.modulename=github.com/sevensolutions/traefik-oidc-auth
      - --experimental.plugins.traefik-oidc-auth.version=v0.15.0

      # Umami analytics plugin
      - --experimental.plugins.umami-feeder.modulename=github.com/astappiev/traefik-umami-feeder
      - --experimental.plugins.umami-feeder.version=v1.4.0

    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"

    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro

    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.ravil.space`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.priority=100"
      - "traefik.http.routers.traefik-dashboard.middlewares=oidc-auth@docker"
      # Global OIDC middleware
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.Url=https://pocketid.ravil.space"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.ClientId=${TRAEFIK_OIDC_CLIENT_ID}"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.ClientSecret=${TRAEFIK_OIDC_CLIENT_SECRET}"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Scopes=openid,profile,email"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Secret=${OIDC_SECRET}"
      # Umami analytics middleware
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiHost=http://umami:3000"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiUsername=${UMAMI_USERNAME}"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiPassword=${UMAMI_PASSWORD}"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.createNewWebsites=true"
      # Exclude health-connect ingest path from analytics (privacy: sync timing must not leak).
      # Regex matched against req.URL.String() (path+query, no host).
      # $$ escapes to literal $ after Docker Compose variable substitution.
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[0]=^/ingest/health-connect(\\?.*)?$$"
      # Exclude nutrition queue and ack paths from analytics (privacy: meal timing must not leak).
      # These routes MUST be excluded BEFORE the health-connect-bridge nutrition routes are live.
      # Gate: traefik must deploy and confirm exclusions active before health-connect-bridge deploys.
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[1]=^/nutrition/queue(\\?.*)?$$"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[2]=^/nutrition/ack(\\?.*)?$$"

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.ravil.space`)"
      - "traefik.http.routers.whoami.entrypoints=web,websecure"
      - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

volumes:
  letsencrypt:
