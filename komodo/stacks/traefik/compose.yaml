services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik
    restart: unless-stopped
    command:
      # API and dashboard
      - --api.dashboard=true
      - --api.debug=true

      # EntryPoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Default middlewares for websecure
      # crowdsec first: banned IPs are rejected before anything else runs
      - --entrypoints.websecure.http.middlewares=crowdsec@docker,umami@docker

      # HTTP to HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # Let's Encrypt with Cloudflare DNS challenge
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json

      # Logging
      - --log.level=INFO
      - --accesslog=true
      # Drop query parameters and headers from access logs (privacy).
      # Prevents health-connect sync timing markers from leaking into log shippers
      # (e.g. Alloy → Loki). Supported by Traefik v3.1+; pinned to v3.7.13.
      - --accesslog.fields.queryparameters.defaultmode=drop
      - --accesslog.fields.headers.defaultmode=drop

      # Dynamic file provider: serversTransports + routes to non-Docker backends (dynamic/)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Global settings
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      # OIDC auth plugin
      - --experimental.plugins.traefik-oidc-auth.modulename=github.com/sevensolutions/traefik-oidc-auth
      - --experimental.plugins.traefik-oidc-auth.version=v0.15.0

      # Umami analytics plugin
      - --experimental.plugins.umami-feeder.modulename=github.com/astappiev/traefik-umami-feeder
      - --experimental.plugins.umami-feeder.version=v1.4.0

      # CrowdSec bouncer plugin
      - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec-bouncer.version=v1.8.1

    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"

    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro

    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.ravil.space`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.priority=100"
      - "traefik.http.routers.traefik-dashboard.middlewares=oidc-auth@docker"
      # Global OIDC middleware
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.Url=https://pocketid.ravil.space"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.ClientId=${TRAEFIK_OIDC_CLIENT_ID}"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Provider.ClientSecret=${TRAEFIK_OIDC_CLIENT_SECRET}"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Scopes=openid,profile,email"
      - "traefik.http.middlewares.oidc-auth.plugin.traefik-oidc-auth.Secret=${OIDC_SECRET}"
      # Umami analytics middleware
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiHost=http://umami:3000"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiUsername=${UMAMI_USERNAME}"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.umamiPassword=${UMAMI_PASSWORD}"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.createNewWebsites=true"
      # Exclude health-connect ingest path from analytics (privacy: sync timing must not leak).
      # Regex matched against req.URL.String() (path+query, no host).
      # $$ escapes to literal $ after Docker Compose variable substitution.
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[0]=^/ingest/health-connect(\\?.*)?$$"
      # Exclude nutrition queue and ack paths from analytics (privacy: meal timing must not leak).
      # These routes MUST be excluded BEFORE the health-connect-bridge nutrition routes are live.
      # Gate: traefik must deploy and confirm exclusions active before health-connect-bridge deploys.
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[1]=^/nutrition/queue(\\?.*)?$$"
      - "traefik.http.middlewares.umami.plugin.umami-feeder.ignoreURLs[2]=^/nutrition/ack(\\?.*)?$$"
      # CrowdSec bouncer: 403 for IPs banned locally or on the community blocklist.
      # Stream mode pulls the ban list every 60s, so requests never wait on CrowdSec.
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.enabled=true"
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecMode=stream"
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecLapiScheme=http"
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecLapiHost=crowdsec:8080"
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.crowdsecLapiKey=${CROWDSEC_BOUNCER_KEY}"
      # Fail open: a broken or restarting CrowdSec must never take down every site
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.updateMaxFailure=-1"
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.streamStartupBlock=false"
      # LAN (split DNS, hairpin via 192.168.1.1) and Docker networks are never banned
      - "traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer.clientTrustedIPs=192.168.1.0/24,172.16.0.0/12,10.0.0.0/8"

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # traefik: parser + base HTTP scenarios (probing, sensitive files, bad UAs, ...)
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/http-cve
      # Registers the "traefik" bouncer with this key on startup
      BOUNCER_KEY_TRAEFIK: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data

  whoami:
    image: traefik/whoami:v1.12.0
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.ravil.space`)"
      - "traefik.http.routers.whoami.entrypoints=web,websecure"
      - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

volumes:
  letsencrypt:
  crowdsec-config:
  crowdsec-data:
