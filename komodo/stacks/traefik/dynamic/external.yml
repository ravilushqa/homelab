# Routes to backends that don't run in Docker on this host (VMs, LXCs, other hosts).
# Picked up live by the file provider (--providers.file.directory + watch).
http:
  routers:
    # No OIDC — Home Assistant has its own auth
    ha:
      rule: Host(`ha.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      service: ha

    # OIDC in front of PVE's own login. Terraform and cluster traffic reach
    # PVE directly on 192.168.1.100:8006, so they don't go through this
    proxmox:
      rule: Host(`proxmox.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      middlewares: [oidc-auth@docker]
      service: proxmox

    # OIDC in front of PBS's own login. PVE and proxmox-backup-client reach
    # PBS directly on 192.168.1.121:8007, so backups don't go through this
    pbs:
      rule: Host(`pbs.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      middlewares: [oidc-auth@docker]
      service: pbs

    # Hermes dashboard on the Hermes host
    hermes:
      rule: Host(`hermes.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      middlewares: [oidc-auth@docker]
      service: hermes

    # health-connect-bridge receiver on the Hermes host. No OIDC: the Android
    # Health Connect app can't do OAuth; the receiver checks pre-shared tokens
    # (X-Health-Token / X-Nutrition-Token). Only exact Host+Path+Method is
    # routed, anything else gets Traefik's 404.
    # PRIVACY: these paths are excluded from the global umami@docker middleware
    # via ignoreURLs in ../compose.yaml; komodo-deploy.yaml checks that before
    # every traefik deploy (services/health-connect-bridge/privacy_gate_check.py).
    health-connect-bridge:
      rule: Host(`health-connect.ravil.space`) && Path(`/ingest/health-connect`) && Method(`POST`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      priority: 200
      service: health-connect-bridge
    health-connect-nutrition-queue:
      rule: Host(`health-connect.ravil.space`) && Path(`/nutrition/queue`) && Method(`GET`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      priority: 200
      service: health-connect-bridge
    health-connect-nutrition-ack:
      rule: Host(`health-connect.ravil.space`) && Path(`/nutrition/ack`) && Method(`POST`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      priority: 200
      service: health-connect-bridge

  services:
    ha:
      loadBalancer:
        servers: [{ url: "http://192.168.1.153:8123" }]
    proxmox:
      loadBalancer:
        serversTransport: proxmox
        servers: [{ url: "https://192.168.1.100:8006" }]
    pbs:
      loadBalancer:
        # PBS serves a self-signed cert too
        serversTransport: proxmox
        servers: [{ url: "https://192.168.1.121:8007" }]
    hermes:
      loadBalancer:
        servers: [{ url: "http://192.168.1.65:9119" }]
    health-connect-bridge:
      loadBalancer:
        servers: [{ url: "http://192.168.1.65:9121" }]
