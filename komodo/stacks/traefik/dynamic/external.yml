# Routes to backends that don't run in Docker on this host (VMs, LXCs, other hosts).
# Picked up live by the file provider (--providers.file.directory + watch).
http:
  routers:
    # No OIDC — Home Assistant has its own auth
    ha:
      rule: Host(`ha.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      service: ha

    # OIDC in front of PVE's own login. Terraform and cluster traffic reach
    # PVE directly on 192.168.1.100:8006, so they don't go through this
    proxmox:
      rule: Host(`proxmox.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      middlewares: [oidc-auth@docker]
      service: proxmox

    # OIDC in front of PBS's own login. PVE and proxmox-backup-client reach
    # PBS directly on 192.168.1.121:8007, so backups don't go through this
    pbs:
      rule: Host(`pbs.ravil.space`)
      entryPoints: [websecure]
      tls: { certResolver: cloudflare }
      middlewares: [oidc-auth@docker]
      service: pbs

  services:
    ha:
      loadBalancer:
        servers: [{ url: "http://192.168.1.153:8123" }]
    proxmox:
      loadBalancer:
        serversTransport: proxmox
        servers: [{ url: "https://192.168.1.100:8006" }]
    pbs:
      loadBalancer:
        # PBS serves a self-signed cert too
        serversTransport: proxmox
        servers: [{ url: "https://192.168.1.121:8007" }]

# Kubernetes services: TLS passthrough to the cluster's Cilium gateway, which
# terminates TLS itself (cert-manager). TCP routers with HostSNI are matched
# before the HTTP routers on websecure; every other host falls through to them.
# To expose a new K8s service, add its hostname here.
tcp:
  routers:
    k8s:
      entryPoints: [websecure]
      rule: >-
        HostSNI(`argocd.ravil.space`)
      tls: { passthrough: true }
      service: k8s

  services:
    k8s:
      loadBalancer:
        servers: [{ address: "192.168.1.222:443" }]
