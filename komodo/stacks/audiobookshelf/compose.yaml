services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      # App state (SQLite) and metadata/covers stay on local volumes — never on SMB
      - config:/config
      - metadata:/metadata
      # Existing read-only CIFS bind on the LXC; fail instead of creating an empty dir if missing
      - type: bind
        source: /mnt/audiobooks
        target: /audiobooks
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Runtime image is node:24-alpine without curl; /healthcheck returns 200
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1/healthcheck', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - traefik
    labels:
      # Set AUDIOBOOKSHELF_TRAEFIK_ENABLED=false until the root user is initialized (see README)
      - "traefik.enable=${AUDIOBOOKSHELF_TRAEFIK_ENABLED:-true}"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.ravil.space`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=cloudflare"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"

volumes:
  config:
  metadata:

networks:
  traefik:
    name: traefik_default
    external: true
