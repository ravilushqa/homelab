services:
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    container_name: grafana-lgtm
    restart: unless-stopped
    deploy:
      replicas: 0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/data
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml
      - ./dashboards:/dashboards
      - ./provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.ravil.space`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.routers.grafana.middlewares=oidc-auth@docker"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_default"

  cadvisor:
    # Pinned: the stack has auto_update = true, so :latest would be re-pulled on
    # every deploy. Bump the tag and digest together.
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    # Collect only what the dashboards use (cpu, memory, network) plus OOM
    # events; disk/diskIO walk /var/lib/docker. Keep only the compose labels
    # instead of every container label and env var.
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,network,oom_event
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.project.working_dir,com.docker.compose.service
    # Hard cgroup cap (no extra swap) so a runaway cadvisor is OOM-killed in its
    # own cgroup instead of triggering a host-wide OOM. GOMEMLIMIT is a soft Go
    # runtime target below the cap, making GC work harder before the hard limit.
    # The CPU cap bounds that GC work (Go 1.25 derives GOMAXPROCS from it).
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
    environment:
      GOMEMLIMIT: 1536MiB
    # LAN only without pinning an IP: the Komodo LXC's sole NIC is on the LAN (IPv6 is ULA) and the router forwards only 443.
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
      # info logs every request; Alloy polls every 5s (~600 lines/min) and ships
      # them to Loki.
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    networks:
      - default

volumes:
  grafana-data:

networks:
  default:
    name: grafana-lgtm_default
  traefik:
    name: traefik_default
    external: true
