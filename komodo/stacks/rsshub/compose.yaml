services:
  rsshub:
    image: diygod/rsshub:latest@sha256:1bca1f868bd932f87ecfef76ec8cbfca2ff893b99617af6616001d21b36a8378
    container_name: rsshub
    restart: unless-stopped
    ports:
      - 1200:1200
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rsshub.rule=Host(`rsshub.ravil.space`)"
      - "traefik.http.routers.rsshub.entrypoints=websecure"
      - "traefik.http.routers.rsshub.tls.certresolver=cloudflare"
      - "traefik.http.services.rsshub.loadbalancer.server.port=1200"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.rsshub.middlewares=oidc-auth@docker"

networks:
  default:
    name: rsshub_default
  traefik:
    name: traefik_default
    external: true
