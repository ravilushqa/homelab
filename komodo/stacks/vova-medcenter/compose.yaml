services:
  db:
    image: postgres:16
    container_name: vova-medcenter-db
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcenters
      POSTGRES_USER: medcenters
      POSTGRES_PASSWORD: medcenters
    volumes:
      - vova-medcenter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcenters -d medcenters"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ghcr.io/zent7/vova-medcenter-backend:282a683efa4464001bd113081a16ec3b5f63b8eb@sha256:c81229230f7981877ed5620a3043b08cbf015afe556de45c0b360c27d91dff3a
    pull_policy: always
    container_name: vova-medcenter-backend
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://medcenters:medcenters@db:5432/medcenters
      FRONTEND_ORIGIN: https://vova-medcenter.ravil.space
      PUBLIC_FRONTEND_ORIGIN: https://vova-medcenter.ravil.space
      GENERATED_DOCUMENTS_DIR: /app/storage/generated
      DOCUMENT_TEMPLATE_OVERRIDES_DIR: /app/storage/template-overrides
    volumes:
      - vova-medcenter-generated:/app/storage/generated
      - vova-medcenter-template-overrides:/app/storage/template-overrides
    labels:
      - "traefik.enable=false"

  frontend:
    image: ghcr.io/zent7/vova-medcenter-frontend:282a683efa4464001bd113081a16ec3b5f63b8eb@sha256:caa8e86918de68d5511d0cb1d4df882421cef82683e975c95ef51c36f6311e4e
    pull_policy: always
    container_name: vova-medcenter-frontend
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.15
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vova-medcenter.rule=Host(`vova-medcenter.ravil.space`)"
      - "traefik.http.routers.vova-medcenter.entrypoints=websecure"
      - "traefik.http.routers.vova-medcenter.tls.certresolver=cloudflare"
      - "traefik.http.services.vova-medcenter.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"

  release-verifier:
    image: alpine:3.24
    pull_policy: always
    container_name: vova-medcenter-release-verifier
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.05
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      EXPECTED_REVISION: 282a683efa4464001bd113081a16ec3b5f63b8eb
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          backend_status="$$(wget -qO- http://backend:8000/api/v1/health || true)"
          frontend_status="$$(wget -qO- http://frontend/build.json || true)"
          if echo "$${backend_status}" | grep -Fq "\"build_revision\":\"$${EXPECTED_REVISION}\"" \
            && echo "$${frontend_status}" | grep -Fq "\"build_revision\":\"$${EXPECTED_REVISION}\""; then
            touch /tmp/release-verified
            exec tail -f /dev/null
          fi
          echo "Waiting for backend and frontend revision $${EXPECTED_REVISION}" >&2
          sleep 5
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/release-verified"]
      interval: 5s
      timeout: 2s
      start_period: 60s
      retries: 6
    labels:
      - "traefik.enable=false"

volumes:
  vova-medcenter-postgres:
  vova-medcenter-generated:
  vova-medcenter-template-overrides:

networks:
  traefik:
    external: true
    name: traefik_default
