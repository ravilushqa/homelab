services:
  db:
    image: postgres:16
    container_name: vova-medcenter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medcenters
      POSTGRES_USER: medcenters
      POSTGRES_PASSWORD: medcenters
    volumes:
      - vova-medcenter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcenters -d medcenters"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: vova-medcenter-backend:f57b394-migration-hotfix
    pull_policy: build
    build:
      context: .
      dockerfile_inline: |
        FROM vova-medcenter-backend:e0ed8bc-doctor-directory
        COPY backend-overlay-f57b394.tar.gz.b64 /tmp/backend-overlay.tar.gz.b64
        RUN python -c "import base64,pathlib,tarfile; p=pathlib.Path('/tmp/backend-overlay.tar.gz.b64'); t=pathlib.Path('/tmp/backend-overlay.tar.gz'); t.write_bytes(base64.b64decode(p.read_bytes())); tarfile.open(t).extractall('/'); p.unlink(); t.unlink()"
    container_name: vova-medcenter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://medcenters:medcenters@db:5432/medcenters
      FRONTEND_ORIGIN: https://vova-medcenter.ravil.space
      PUBLIC_FRONTEND_ORIGIN: https://vova-medcenter.ravil.space
      GENERATED_DOCUMENTS_DIR: /app/storage/generated
    volumes:
      - vova-medcenter-generated:/app/storage/generated
    labels:
      - "traefik.enable=false"

  frontend:
    image: vova-medcenter-frontend:e0ed8bc-doctor-directory
    pull_policy: build
    build:
      context: .
      dockerfile_inline: |
        FROM vova-medcenter-frontend:e292e43-research-fields
        COPY frontend-overlay-e0ed8bc.tar.gz.b64 /tmp/frontend-overlay.tar.gz.b64
        RUN base64 -d /tmp/frontend-overlay.tar.gz.b64 > /tmp/frontend-overlay.tar.gz && tar -xzf /tmp/frontend-overlay.tar.gz -C / && rm -f /tmp/frontend-overlay.tar.gz.b64 /tmp/frontend-overlay.tar.gz
    container_name: vova-medcenter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vova-medcenter.rule=Host(`vova-medcenter.ravil.space`)"
      - "traefik.http.routers.vova-medcenter.entrypoints=websecure"
      - "traefik.http.routers.vova-medcenter.tls.certresolver=cloudflare"
      - "traefik.http.services.vova-medcenter.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_default"

volumes:
  vova-medcenter-postgres:
  vova-medcenter-generated:

networks:
  traefik:
    external: true
    name: traefik_default
