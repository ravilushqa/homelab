services:
  pbs:
    image: traefik/whoami
    restart: unless-stopped
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pbs.rule=Host(`pbs.ravil.space`)"
      - "traefik.http.routers.pbs.entrypoints=websecure"
      - "traefik.http.routers.pbs.tls.certresolver=cloudflare"
      # OIDC in front of PBS's own PAM/PBS login. PVE and proxmox-backup-client
      # reach PBS directly on 192.168.1.121:8007, so backups don't go through this
      - "traefik.http.routers.pbs.middlewares=oidc-auth@docker"
      - "traefik.http.services.pbs-svc.loadbalancer.server.url=https://192.168.1.121:8007"
      # Reuses the insecureSkipVerify transport: PBS serves a self-signed cert
      - "traefik.http.services.pbs-svc.loadbalancer.serverstransport=proxmox@file"
      - "traefik.http.services.pbs-svc.loadbalancer.passHostHeader=true"

networks:
  traefik_default:
    external: true
