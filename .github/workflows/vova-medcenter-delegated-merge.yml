name: vova-medcenter delegated merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate and merge
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scope:
    name: vova-medcenter delegated scope
    runs-on: ubuntu-latest
    outputs:
      automerge: ${{ steps.scope.outputs.automerge }}
      pr_url: ${{ steps.scope.outputs.pr_url }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      generated: ${{ steps.scope.outputs.generated }}
      head_ref: ${{ steps.scope.outputs.head_ref }}
      revision: ${{ steps.scope.outputs.revision }}
      backend_image: ${{ steps.scope.outputs.backend_image }}
      frontend_image: ${{ steps.scope.outputs.frontend_image }}
      expected_revision: ${{ steps.scope.outputs.expected_revision }}
    steps:
      - name: Check delegated PR scope
        id: scope
        uses: actions/github-script@v9
        with:
          script: |
            const trustedLogin = 'Zent7';
            const allowedPrefix = 'komodo/stacks/vova-medcenter/';
            const generatedLogin = 'github-actions[bot]';
            const generatedBranchPattern = /^automation\/vova-medcenter-([0-9a-f]{7,40})$/;
            const composePath = 'komodo/stacks/vova-medcenter/compose.yaml';
            let pr = context.payload.pull_request;

            if (!pr && context.eventName === 'workflow_dispatch') {
              const prNumberInput = context.payload.inputs?.pr_number ?? core.getInput('pr_number');
              const prNumber = Number(prNumberInput);
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed(`Invalid pr_number input: ${prNumberInput}`);
                return;
              }

              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = response.data;
            }

            if (!pr) {
              core.setFailed('This workflow must run on pull_request_target or workflow_dispatch.');
              return;
            }

            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('generated', 'false');
            core.setOutput('head_ref', pr.head.ref);

            const author = pr.user.login;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const changed = files.map((file) => file.filename);
            core.info(`Changed files:\n${changed.join('\n')}`);

            if (changed.length === 0) {
              core.setFailed('PR has no changed files.');
              return;
            }

            if (author === trustedLogin) {
              const outsideScope = changed.filter((filename) => !filename.startsWith(allowedPrefix));
              if (outsideScope.length > 0) {
                core.setFailed(
                  `Zent7 is delegated only for ${allowedPrefix}*. Outside-scope files:\n` +
                  outsideScope.map((filename) => `- ${filename}`).join('\n')
                );
                return;
              }

              core.notice(`Delegated scope check passed for ${trustedLogin}; auto-merge is allowed.`);
              core.setOutput('automerge', 'true');
              return;
            }

            const branchMatch = pr.head.ref.match(generatedBranchPattern);
            if (author !== generatedLogin || !branchMatch) {
              core.info(
                `PR author/head is ${author}/${pr.head.ref}; delegated auto-merge disabled.`
              );
              core.setOutput('automerge', 'false');
              return;
            }

            if (pr.base.ref !== 'main') {
              core.setFailed(
                `Generated vova-medcenter release PRs must target main; found ${pr.base.ref}.`
              );
              return;
            }

            if (changed.length !== 1 || changed[0] !== composePath) {
              core.setFailed(
                `Generated vova-medcenter release PRs may change only ${composePath}. Changed files:\n` +
                changed.map((filename) => `- ${filename}`).join('\n')
              );
              return;
            }

            async function readFileAtRef(path, ref) {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`${path} at ${ref} is not a file.`);
              }
              return Buffer.from(response.data.content, response.data.encoding).toString('utf8');
            }

            const baseContent = await readFileAtRef(composePath, pr.base.sha);
            const headContent = await readFileAtRef(composePath, pr.head.sha);
            const baseLines = baseContent.split('\n');
            const headLines = headContent.split('\n');

            if (baseLines.length !== headLines.length) {
              core.setFailed('Generated compose.yaml change may update only existing image and EXPECTED_REVISION lines.');
              return;
            }

            const changedLines = [];
            for (let index = 0; index < baseLines.length; index += 1) {
              if (baseLines[index] !== headLines[index]) {
                changedLines.push({ number: index + 1, before: baseLines[index], after: headLines[index] });
              }
            }

            const releasePrefix = branchMatch[1];
            const imagePattern = (service) => new RegExp(
              `^    image: ghcr\\.io/zent7/vova-medcenter-${service}:([0-9a-f]{40})@sha256:([0-9a-f]{64})$`
            );
            const expectedRevisionPattern = /^      EXPECTED_REVISION: ([0-9a-f]{40})$/;
            const oldImagePattern = (service) => new RegExp(
              `^    image: ghcr\\.io/zent7/vova-medcenter-${service}:[0-9a-f]{40}(?:@sha256:[0-9a-f]{64})?$`
            );
            const oldExpectedRevisionPattern = /^      EXPECTED_REVISION: [0-9a-f]{40}$/;

            const found = {
              backendRevision: null,
              backendImage: null,
              frontendRevision: null,
              frontendImage: null,
              expectedRevision: null,
            };

            for (const line of changedLines) {
              const backendMatch = line.after.match(imagePattern('backend'));
              const frontendMatch = line.after.match(imagePattern('frontend'));
              const expectedRevisionMatch = line.after.match(expectedRevisionPattern);

              if (backendMatch && oldImagePattern('backend').test(line.before)) {
                found.backendRevision = backendMatch[1];
                found.backendImage = line.after.trim().replace(/^image:\s+/, '');
              } else if (frontendMatch && oldImagePattern('frontend').test(line.before)) {
                found.frontendRevision = frontendMatch[1];
                found.frontendImage = line.after.trim().replace(/^image:\s+/, '');
              } else if (expectedRevisionMatch && oldExpectedRevisionPattern.test(line.before)) {
                found.expectedRevision = expectedRevisionMatch[1];
              } else {
                core.setFailed(
                  `Suspicious generated compose.yaml change at line ${line.number}; only backend image, frontend image, and EXPECTED_REVISION may change.`
                );
                return;
              }
            }

            if (changedLines.length !== 3 || !found.backendRevision || !found.backendImage || !found.frontendRevision || !found.frontendImage || !found.expectedRevision) {
              core.setFailed(
                'Generated compose.yaml change must update exactly the backend image, frontend image, and EXPECTED_REVISION lines.'
              );
              return;
            }

            const revisions = new Set([found.backendRevision, found.frontendRevision, found.expectedRevision]);
            if (revisions.size !== 1) {
              core.setFailed(
                `Generated compose.yaml revisions must match; found backend=${found.backendRevision}, frontend=${found.frontendRevision}, EXPECTED_REVISION=${found.expectedRevision}.`
              );
              return;
            }

            const revision = found.expectedRevision;
            if (!revision.startsWith(releasePrefix)) {
              core.setFailed(
                `Generated compose.yaml revision ${revision} does not match branch revision ${releasePrefix}.`
              );
              return;
            }

            core.notice(`Generated vova-medcenter release check passed for ${revision}; auto-merge is allowed.`);
            core.setOutput('generated', 'true');
            core.setOutput('revision', revision);
            core.setOutput('backend_image', found.backendImage);
            core.setOutput('frontend_image', found.frontendImage);
            core.setOutput('expected_revision', found.expectedRevision);
            core.setOutput('automerge', 'true');

  automerge:
    name: vova-medcenter delegated auto-merge
    needs: scope
    if: needs.scope.outputs.automerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for generated PR refresh
        if: needs.scope.outputs.generated == 'true'
        uses: actions/checkout@v6
        with:
          repository: ravilushqa/homelab
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Refresh generated PR branch if needed
        if: needs.scope.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.scope.outputs.pr_number }}
          HEAD_REF: ${{ needs.scope.outputs.head_ref }}
          REVISION: ${{ needs.scope.outputs.revision }}
          BACKEND_IMAGE: ${{ needs.scope.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.scope.outputs.frontend_image }}
          EXPECTED_REVISION: ${{ needs.scope.outputs.expected_revision }}
        run: |
          set -euo pipefail

          COMPOSE_PATH="komodo/stacks/vova-medcenter/compose.yaml"
          MERGE_STATE="UNKNOWN"
          for attempt in {1..10}; do
            MERGE_STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
            echo "Generated PR #$PR_NUMBER mergeStateStatus: $MERGE_STATE"
            if [ "$MERGE_STATE" != "UNKNOWN" ]; then
              break
            fi
            sleep 3
          done

          case "$MERGE_STATE" in
            CLEAN|HAS_HOOKS|UNSTABLE|BLOCKED|UNKNOWN)
              echo "Branch refresh not needed for mergeStateStatus=$MERGE_STATE."
              exit 0
              ;;
            BEHIND|DIRTY)
              echo "Refreshing generated branch for mergeStateStatus=$MERGE_STATE."
              ;;
            *)
              echo "Refreshing generated branch for unexpected mergeStateStatus=$MERGE_STATE."
              ;;
          esac

          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          LEASE_SHA=$(git rev-parse "origin/${HEAD_REF}")
          git switch -C "$HEAD_REF" origin/main

          perl -0pi -e '
            our $replacement_count;
            $replacement_count += s{^    image: ghcr\.io/zent7/vova-medcenter-backend:[0-9a-f]{40}(?:\@sha256:[0-9a-f]{64})?$}{"    image: $ENV{BACKEND_IMAGE}"}gme;
            $replacement_count += s{^    image: ghcr\.io/zent7/vova-medcenter-frontend:[0-9a-f]{40}(?:\@sha256:[0-9a-f]{64})?$}{"    image: $ENV{FRONTEND_IMAGE}"}gme;
            $replacement_count += s{^      EXPECTED_REVISION: [0-9a-f]{40}$}{"      EXPECTED_REVISION: $ENV{EXPECTED_REVISION}"}gme;
            END {
              die "Expected to update exactly 3 vova-medcenter compose lines; updated $replacement_count.\n"
                if $replacement_count != 3;
            }
          ' "$COMPOSE_PATH"

          if git diff --quiet -- "$COMPOSE_PATH"; then
            echo "Branch already matches generated vova-medcenter values; no commit needed."
            exit 0
          fi

          git diff -- "$COMPOSE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$COMPOSE_PATH"
          git commit -m "Update vova-medcenter images to ${REVISION:0:7}"
          git push origin "HEAD:${HEAD_REF}" --force-with-lease="refs/heads/${HEAD_REF}:${LEASE_SHA}"
          echo "Refreshed ${HEAD_REF} from origin/main with generated vova-medcenter image lines."

      - name: Enable auto-merge for delegated PR
        env:
          # GITHUB_TOKEN is enough to merge this trusted, path-scoped PR, but its
          # resulting push does not trigger other workflows. Therefore this job
          # deploys vova-medcenter explicitly after GitHub reports the PR merged.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ needs.scope.outputs.pr_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch --auto

      - name: Wait for merge to complete
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.scope.outputs.pr_number }}
        run: |
          for attempt in {1..60}; do
            STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged."
              exit 0
            fi
            echo "Waiting for PR #$PR_NUMBER to merge; current state: $STATE"
            sleep 10
          done
          echo "Timed out waiting for PR #$PR_NUMBER to merge."
          exit 1

      - name: Deploy vova-medcenter in Komodo
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          RESPONSE=$(curl -sf -X POST https://komodo.ravil.space/execute \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d '{"type":"DeployStack","params":{"stack":"vova-medcenter"}}')
          echo "$RESPONSE" | jq '{success: .success}'
