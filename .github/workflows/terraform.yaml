name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'

jobs:
  plan:
    runs-on: [self-hosted, homelab]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # Read-only, so a hang (e.g. on releasing the Terraform Cloud lock) is safe to kill
    timeout-minutes: 10
    defaults:
      run:
        working-directory: homelab-main/terraform

    env:
      TF_TOKEN_app_terraform_io: "${{ secrets.TF_API_TOKEN }}"
      TF_VAR_proxmox_endpoint: "https://192.168.1.100:8006"
      TF_VAR_proxmox_api_token: "${{ secrets.PM_API_TOKEN_ID }}=${{ secrets.PM_API_TOKEN_SECRET }}"
      TF_VAR_default_gateway: "${{ secrets.TF_VAR_DEFAULT_GATEWAY }}"
      TF_VAR_datastore_id: "${{ secrets.TF_VAR_DATASTORE_ID }}"

    steps:
      # Own subfolder: deploy/vova-medcenter jobs check out their branch in the default workspace
      # on the same runner, which left main's checkout there with missing files
      - uses: actions/checkout@v7
        with:
          path: homelab-main

      - name: Write sealed-secrets certs
        run: |
          mkdir -p modules/sealed-secrets/certs
          printf %s "${{ secrets.SEALED_SECRETS_CERT }}" > modules/sealed-secrets/certs/sealed-secrets.cert
          printf %s "${{ secrets.SEALED_SECRETS_KEY }}" > modules/sealed-secrets/certs/sealed-secrets.key

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # PR plans are read-only and don't lock the state: they can't race each other or the
      # plan/apply on main for the workspace lock, and a stuck lock doesn't block reviews
      - name: Terraform Plan
        run: terraform plan -no-color -input=false ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
        id: plan

      - name: Comment Plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `#### Terraform Plan ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    runs-on: [self-hosted, homelab]
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: homelab-main/terraform

    env:
      TF_TOKEN_app_terraform_io: "${{ secrets.TF_API_TOKEN }}"
      TF_VAR_proxmox_endpoint: "https://192.168.1.100:8006"
      TF_VAR_proxmox_api_token: "${{ secrets.PM_API_TOKEN_ID }}=${{ secrets.PM_API_TOKEN_SECRET }}"
      TF_VAR_default_gateway: "${{ secrets.TF_VAR_DEFAULT_GATEWAY }}"
      TF_VAR_datastore_id: "${{ secrets.TF_VAR_DATASTORE_ID }}"

    steps:
      # Own subfolder: deploy/vova-medcenter jobs check out their branch in the default workspace
      # on the same runner, which left main's checkout there with missing files
      - uses: actions/checkout@v7
        with:
          path: homelab-main

      - name: Write sealed-secrets certs
        run: |
          mkdir -p modules/sealed-secrets/certs
          printf %s "${{ secrets.SEALED_SECRETS_CERT }}" > modules/sealed-secrets/certs/sealed-secrets.cert
          printf %s "${{ secrets.SEALED_SECRETS_KEY }}" > modules/sealed-secrets/certs/sealed-secrets.key

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color -input=false
