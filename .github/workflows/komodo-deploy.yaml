name: Komodo Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'komodo/**'
      - '.github/workflows/komodo-deploy.yaml'

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up privacy gate Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/gate_venv"
          "$RUNNER_TEMP/gate_venv/bin/pip" install --quiet pyyaml

      - name: Detect changed stacks
        id: changed
        run: |
          # A stack is "changed" if files under komodo/stacks/<name>/ changed
          # or its [stack.config] in komodo/stacks.toml changed (env, repo, ...).
          # Only stacks declared in komodo/stacks.toml at HEAD are kept.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- komodo/stacks/ \
            | awk -F'/' '$1 == "komodo" && $2 == "stacks" && NF > 3 {print $3}' \
            | python3 -c '
          import subprocess, sys, tomllib

          def load(rev):
              try:
                  raw = subprocess.run(
                      ["git", "show", f"{rev}:komodo/stacks.toml"],
                      check=True, capture_output=True, text=True,
                  ).stdout
              except subprocess.CalledProcessError:
                  return {}
              return {s["name"]: s.get("config") for s in tomllib.loads(raw).get("stack", [])}

          old, new = load("HEAD~1"), load("HEAD")
          changed = {line.strip() for line in sys.stdin if line.strip()}
          changed |= {name for name, config in new.items() if old.get(name) != config}
          print(" ".join(sorted(name for name in changed if name in new)))
          ')
          echo "stacks=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed stacks: $CHANGED"

      - name: Sync and deploy changed stacks
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_URL: "http://192.168.1.166:9120"
        run: |
          # Komodo DeployStack / RunSync are asynchronous.
          # Execute response shape (MongoDB Extended JSON):
          #   { "_id": { "$oid": "<hex>" }, "status": "Queued"|"InProgress"|"Complete",
          #     "success": false, ... }
          # Poll via: POST /read {"type":"GetUpdate","params":{"id":"<hex>"}}
          # Complete when: status == "Complete" AND success == true
          # Source: verified against live StopStack response on this Komodo instance.

          # Submit an execute request and return the plain update-ID hex string.
          komodo_execute() {
            local stack="$1" payload="$2"
            local raw http_code body update_id
            raw=$(curl -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' -X POST "$KOMODO_URL/execute" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              -d "$payload") || return 1
            http_code=$(printf '%s' "$raw" | tail -n1)
            body=$(printf '%s' "$raw" | head -n -1)
            if [ "$http_code" -ne 200 ]; then
              echo "FAIL: $stack — HTTP $http_code" >&2
              return 1
            fi
            # Extract hex ID from MongoDB $oid wrapper: {"_id":{"$oid":"<hex>"},...}
            update_id=$(printf '%s' "$body" | jq -er '._id["$oid"]') || { echo "FAIL: $stack — could not extract update ID" >&2; return 1; }
            if ! printf '%s' "$update_id" | grep -qE '^[0-9a-f]{24}$'; then
              echo "FAIL: $stack — update ID is not a valid hex24: $update_id" >&2
              return 1
            fi
            printf '%s' "$update_id"
          }

          # Poll GetUpdate until Complete; returns 0 on success, 1 on failure/timeout.
          wait_for_update() {
            local update_id="$1" stack="$2"
            local max_wait=300 elapsed=0
            echo "Waiting for $stack (update $update_id)..."
            while [ "$elapsed" -lt "$max_wait" ]; do
              local raw http_code body status success
              raw=$(curl -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' -X POST "$KOMODO_URL/read" \
                -H "Content-Type: application/json" \
                -H "X-Api-Key: $KOMODO_API_KEY" \
                -H "X-Api-Secret: $KOMODO_API_SECRET" \
                -d "{\"type\":\"GetUpdate\",\"params\":{\"id\":\"$update_id\"}}") || { echo "FAIL: $stack — GetUpdate curl error" >&2; return 1; }
              http_code=$(printf '%s' "$raw" | tail -n1)
              body=$(printf '%s' "$raw" | head -n -1)
              if [ "$http_code" -ne 200 ]; then
                echo "FAIL: $stack — GetUpdate HTTP $http_code" >&2
                return 1
              fi
              status=$(printf '%s' "$body" | jq -r '.status')
              case "$status" in
                Complete)
                  success=$(printf '%s' "$body" | jq -r '.success')
                  if [ "$success" = "true" ]; then
                    echo "OK: $stack"
                    return 0
                  else
                    echo "FAIL: $stack — Komodo reported success=false" >&2
                    return 1
                  fi
                  ;;
                Queued|InProgress)
                  sleep 5
                  elapsed=$((elapsed + 5))
                  ;;
                *)
                  echo "FAIL: $stack — unexpected status: $status" >&2
                  return 1
                  ;;
              esac
            done
            echo "FAIL: $stack — timed out after ${max_wait}s" >&2
            return 1
          }

          deploy_and_wait() {
            local stack="$1"
            local update_id
            echo "Deploying stack: $stack" >&2
            update_id=$(komodo_execute "$stack" "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$stack\"}}") || return 1
            wait_for_update "$update_id" "$stack"
          }

          # Apply komodo/stacks.toml to Komodo before deploying, so new stacks
          # exist and changed stack configs are in place. The sync itself does
          # not deploy anything (no `deploy = true`): it would deploy all stacks
          # in parallel and saturate the host CPU. Retries cover a sync that is
          # already running (e.g. started by the repo webhook).
          sync_and_wait() {
            local sync="homelab-stacks" attempt update_id
            for attempt in 1 2 3 4 5; do
              echo "Running resource sync: $sync (attempt $attempt)" >&2
              if update_id=$(komodo_execute "$sync" "{\"type\":\"RunSync\",\"params\":{\"sync\":\"$sync\"}}") \
                && wait_for_update "$update_id" "$sync"; then
                return 0
              fi
              sleep 15
            done
            return 1
          }

          if ! sync_and_wait; then
            echo "::warning::Resource sync failed — deploying with the stack config Komodo currently has"
          fi

          CHANGED="${{ steps.changed.outputs.stacks }}"
          FAILED=0

          if [ -z "$CHANGED" ]; then
            echo "No changed stacks to deploy"
            exit 0
          fi

          # Privacy + ordering gate:
          # traefik ALWAYS deploys first when health-connect-bridge changes —
          # even if traefik is not in the changed set. This ensures the running
          # Traefik has the required Umami exclusions BEFORE nutrition routes go live.
          #
          # gate_script runs privacy_gate_check.py:
          #   --source: validates actual compose label values (not comments)
          #   --live-host: SSHes to host, runs docker inspect to verify live state
          # If either check fails: ABORT. Runbook: fix traefik compose, redeploy.
          gate_privacy_check() {
            local traefik_host="192.168.1.166"
            echo "Running privacy gate check (source + live Traefik API)..."
            "$RUNNER_TEMP/gate_venv/bin/python" services/health-connect-bridge/privacy_gate_check.py \
              --source komodo/stacks/traefik/compose.yaml \
              --live-host "$traefik_host" \
              --ssh-user claw \
            || {
              echo "ABORT: privacy gate FAILED — nutrition routes must not be exposed" >&2
              echo "  Traefik must have active Umami exclusions before health-connect-bridge deploys." >&2
              echo "  Runbook: fix traefik compose labels + redeploy traefik, then retry." >&2
              return 1
            }
          }

          if echo " $CHANGED " | grep -qw "health-connect-bridge"; then
            # Always deploy-and-wait traefik first, regardless of whether it changed,
            # to ensure the running Traefik has current privacy exclusions.
            echo "health-connect-bridge changed — deploying traefik first for privacy gate"
            if ! deploy_and_wait "traefik"; then
              echo "ABORT: traefik deploy failed — cannot verify privacy exclusions are active" >&2
              exit 1
            fi
            # Run the privacy gate: source check + live Traefik API check
            if ! gate_privacy_check; then
              exit 1
            fi
          elif echo " $CHANGED " | grep -qw traefik; then
            if ! deploy_and_wait "traefik"; then
              echo "ABORT: traefik deploy failed — skipping all remaining stacks" >&2
              exit 1
            fi
          fi

          # Deploy all other changed stacks (traefik already handled above).
          for STACK in $CHANGED; do
            [ "$STACK" = "traefik" ] && continue
            deploy_and_wait "$STACK" || FAILED=1
          done

          exit $FAILED
