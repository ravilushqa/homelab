name: Privacy Gate

# Nightly check that the running Traefik still excludes the health-connect paths
# from Umami (komodo-deploy.yaml checks it only around traefik deploys). This
# replaces the check the nutrition writeback used to run over SSH before every meal.
on:
  schedule:
    - cron: '30 3 * * *'  # daily at 3:30am UTC
  workflow_dispatch:

jobs:
  gate:
    # The runner shares the Docker host with Traefik, so --live-host local works
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: homelab-main
    steps:
      # Own subfolder: deploy/vova-medcenter jobs check out their branch in the default workspace
      # on the same runner, which left main's checkout there with missing files
      - uses: actions/checkout@v7
        with:
          path: homelab-main

      - name: Run privacy gate
        run: |
          python3 -m venv "$RUNNER_TEMP/gate_venv"
          "$RUNNER_TEMP/gate_venv/bin/pip" install --quiet pyyaml
          "$RUNNER_TEMP/gate_venv/bin/python" .github/scripts/privacy_gate_check.py \
            --source komodo/stacks/traefik/compose.yaml \
            --live-host local
